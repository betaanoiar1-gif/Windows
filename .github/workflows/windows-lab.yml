name: Windows lab validation

on:
  workflow_dispatch:
    inputs:
      network_probes:
        description: 'Run bounded real DNS/HTTPS/network probes'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-lab:
    name: Disposable Windows VM lab
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Windows lab identity
        shell: pwsh
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, CsNumberOfLogicalProcessors, CsTotalPhysicalMemory
          python --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q smartpc main.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Unified regression suite
        run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: CLI smoke test
        run: python main.py --help
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Offline inspection on real Windows VM
        run: python main.py --inspect --no-ai --no-network-probes
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Network intelligence inspection
        if: ${{ github.event_name == 'push' || inputs.network_probes == true }}
        shell: pwsh
        run: |
          python main.py --network --no-ai | Tee-Object network-lab.json
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify startup observation is read-only
        shell: pwsh
        run: |
          python -c "from smartpc.startup import entries; print('startup_entries=', len(entries()))"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Safe optimization dry validation
        shell: pwsh
        run: |
          python -c "from smartpc.policy import PolicyEngine; from smartpc.models import Candidate,Risk,Action; p=PolicyEngine(); c=Candidate('x','temp',1,10,Risk.SAFE,Action.QUARANTINE,'test',True); print('auto_allowed=',p.allow(c,0,0))"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartpc-windows-lab-${{ github.run_id }}
          path: network-lab.json
          if-no-files-found: ignore
          retention-days: 7
